<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1A2530" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var saved = JSON.parse(localStorage.getItem('wedding-config') || '{}');
          var c = saved.colors || {};
          var r = document.documentElement.style;
          if (c.cream) r.setProperty('--color-cream', c.cream);
          if (c.navy) r.setProperty('--color-navy', c.navy);
          if (c.floralSlate) r.setProperty('--color-floral-slate', c.floralSlate);
          if (c.mauve) r.setProperty('--color-mauve', c.mauve);
          if (c.gold) r.setProperty('--color-gold', c.gold);
          if (c.parchment) r.setProperty('--color-parchment', c.parchment);
          if (c.navy) document.querySelector('meta[name="theme-color"]').content = c.navy;
          if (saved.coupleNames) document.title = saved.coupleNames + ' — Wedding';
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="google-fonts" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-cream">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
